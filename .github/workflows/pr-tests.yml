name: PR tests

on:
  pull_request:
    branches:
      - main

permissions:
  issues: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Enable corepack and pnpm
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate

      - name: Install server dependencies
        working-directory: server
        run: pnpm install --frozen-lockfile

      - name: Run tests with coverage
        working-directory: server
        run: |
          mkdir -p ../test-results
          pnpm test -- --coverage --reporter=text | tee ../test-results/test-output.txt
        continue-on-error: true

      - name: Post PR comment with test output
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            const path = 'test-results/test-output.txt';
            let body = 'No test output found.';
            if (fs.existsSync(path)) {
              const output = fs.readFileSync(path, 'utf8');
              body = '### Test results\n\n```\n' + output + '\n```';
            }
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body
            });
