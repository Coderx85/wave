apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: server
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:18-alpine
        env:
        - name: POSTGRES_USER
          value: postgres
        - name: POSTGRES_PASSWORD
          value: postgres
        - name: POSTGRES_DB
          value: wave_db
        ports:
        - containerPort: 5432
        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql
        resources:
          requests:
            memory: 256Mi
            cpu: 100m
        startupProbe:
          exec:
            command: ["pg_isready", "-U", "postgres"]
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          exec:
            command: ["pg_isready", "-U", "postgres"]
          initialDelaySeconds: 30
          periodSeconds: 10
  volumeClaimTemplates:
  - metadata:
      name: postgres-data
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 1Gi

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: tigerbeetle
  namespace: server
spec:
  serviceName: tigerbeetle
  replicas: 1
  selector:
    matchLabels:
      app: tigerbeetle
  template:
    metadata:
      labels:
        app: tigerbeetle
    spec:
      initContainers:
      - name: tigerbeetle-format
        image: ghcr.io/tigerbeetle/tigerbeetle:latest
        command:
        - sh
        - -c
        - |
          if [ ! -f /data/tigerbeetle ]; then
            /tigerbeetle format --cluster=0 --replica=0 --replica-count=1 /data/tigerbeetle
          else
            echo "data file already exists, skipping format"
          fi
        volumeMounts:
        - name: tigerbeetle-data
          mountPath: /data
      containers:
      - name: tigerbeetle
        image: ghcr.io/tigerbeetle/tigerbeetle:latest
        args:
        - start
        - --addresses=0.0.0.0:4343
        - /data/tigerbeetle
        ports:
        - containerPort: 4343
        volumeMounts:
        - name: tigerbeetle-data
          mountPath: /data
        resources:
          requests:
            memory: 1Gi
            cpu: 500m
        startupProbe:
          exec:
            command:
            - sh
            - -c
            - "kill -0 $(pidof tigerbeetle) 2>/dev/null || exit 1"
          initialDelaySeconds: 3
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 10
  volumeClaimTemplates:
  - metadata:
      name: tigerbeetle-data
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 1Gi
