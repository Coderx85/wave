apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: server
spec:
  type: ClusterIP
  selector:
    app: postgres
  ports:
  - protocol: TCP
    port: 5432
    targetPort: 5432

---
apiVersion: v1
kind: Service
metadata:
  name: tigerbeetle
  namespace: server
spec:
  type: ClusterIP
  selector:
    app: tigerbeetle
  ports:
  - protocol: TCP
    port: 4343
    targetPort: 4343

---
apiVersion: v1
kind: Service
metadata:
  name: backend-server
  namespace: server
spec:
  type: NodePort
  selector:
    app: backend-server
  ports:
  - protocol: TCP
    port: 3000
    targetPort: 3000
    nodePort: 30090
