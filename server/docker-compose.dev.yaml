version: '3.8'

services: 
  database: 
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: wave_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend-server:
    build: .
    command: node --import tsx src/index.ts
    env_file:
      - src/.env.development
    environment:
      DATABASE_URL: postgresql://postgres:postgres@database:5432/wave_db
    expose:
      - "3000"
    depends_on:
      database:
        condition: service_healthy  
    profiles: [backend]

  auth-service:
    build: .
    command: node --import tsx src/index.ts
    env_file:
      - src/.env.development
    environment:
      DATABASE_URL: postgresql://postgres:postgres@database:5432/wave_db
    ports:
      - "3003:3000"
    depends_on:
      database:
        condition: service_healthy  
    profiles: [devops]
  
  user-service:
    build: .
    command: node --import tsx src/index.ts
    env_file:
      - src/.env.development
    environment:
      DATABASE_URL: postgresql://postgres:postgres@database:5432/wave_db
    ports:
      - "3002:3000"
    depends_on:
      database:
        condition: service_healthy  
    profiles: [devops]

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:latest
    container_name: redpanda
    command:
      - redpanda
      - start
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr
      - PLAINTEXT://redpanda:29092,OUTSIDE://localhost:9092
      - --node-id
      - "1"
    ports:
      - "9092:9092"
      - "29092:29092"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster info"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      REDPANDA_AUTO_CREATE_TOPICS_ENABLED: "true"

  mailhog:
    image: mailhog/mailhog:latest
    container_name: mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8025"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles: [devops]

  wallet-service:
    build: .
    command: node --import tsx src/index.ts
    env_file:
      - src/.env.development
    environment:
      DATABASE_URL: postgresql://postgres:postgres@database:5432/wave_db
      KAFKA_BROKER_URL: redpanda:29092
      EMAIL_HOST: mailhog
      EMAIL_PORT: 1025
    ports:
      - "3001:3000"
    depends_on:
      database:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      mailhog:
        condition: service_healthy
      dragonfly:
        condition: service_healthy
    profiles: [devops]

  dragonfly:
    image: dragonflydb/dragonfly:latest
    container_name: dragonfly
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-h", "localhost", "-p", "6379", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles: [devops]

  tigerbeetle:
    image: ghcr.io/tigerbeetle/tigerbeetle:latest
    container_name: tigerbeetle
    command:
      - start
      - --addresses=0.0.0.0:4343
      - /data/tigerbeetle
    ports:
      - "4343:4343"
    volumes:
      - tigerbeetle_data:/data
    healthcheck:
      test: ["CMD-SHELL", "kill -0 $$(pidof tigerbeetle) 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  notification-service:
    build: .
    command: node --import tsx src/notification-service.ts
    env_file:
      - src/.env.development
    environment:
      DATABASE_URL: postgresql://postgres:postgres@database:5432/wave_db
      KAFKA_BROKER_URL: redpanda:29092
      EMAIL_HOST: mailhog
      EMAIL_PORT: 1025
    depends_on:
      database:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      mailhog:
        condition: service_healthy
    profiles: [devops]

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - auth-service
      - wallet-service
      - user-service
    ports:
      - "3000:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    profiles: [devops]

volumes:
  postgres_data:
  tigerbeetle_data:
